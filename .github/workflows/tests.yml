on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run API tests
        run: pytest tests/ -v --alluredir=allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v3.2.2
        if: always()
        with:
          name: allure-results
          path: allure-results/

      - name: Run API tests
        run: pytest tests/ -v -k "not test_ui"
